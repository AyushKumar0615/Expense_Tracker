[project]
name = "expense-tracker-backend"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = [
    "Django==4.2.7",
    "djangorestframework==3.14.0",
    "djangorestframework-simplejwt==5.3.0",
    "django-cors-headers==4.3.1",
    "Pillow==10.1.0",
    "python-decouple==3.8",
    "python-dotenv==1.0.0",
    "mysqlclient==2.2.0"
]

[tool.vercel]
entrypoint = "expense_tracker.wsgi:application"
